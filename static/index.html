<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosala</title>
<style>
  /* Layout: one centred working column, tabs on top, result under the form. Works offline (no web fonts). */
  :root {
    --ink: #172a3a; --muted: #5b6b78; --line: #d9e0e6; --paper: #f6f4ef; --card: #ffffff;
    --accent: #0b6e4f; --accent-ink: #ffffff; --sun: #f2c14e; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
    --err-bg: #fde8e6; --err-ink: #8a1f11;
    --display: "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8edf1; --muted: #a3b1bc; --line: #2f3d48; --paper: #121a21; --card: #1a242d;
      --accent: #3fb68b; --accent-ink: #0c1a14; --sun: #f2c14e; --warn-bg: #3a3218; --warn-ink: #f5dc96;
      --err-bg: #3b1d1a; --err-ink: #f6b8ae; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .brand h1 { font: 700 2.1rem/1 var(--display); margin: 0; letter-spacing: -0.01em; }
  .brand h1 span { display: inline-block; width: .5em; height: .5em; background: var(--sun); border-radius: 50%; margin-left: 4px; }
  .brand p { margin: 6px 0 0; color: var(--muted); }
  .ui-lang { display: flex; gap: 6px; flex-wrap: wrap; }
  .ui-lang button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .ui-lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .status { font-size: .9rem; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .status.err { display: block; background: var(--err-bg); color: var(--err-ink); }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 0; overflow-x: auto; }
  nav button { flex: 0 0 auto; border: 0; background: none; font: 600 1rem var(--body); color: var(--muted); padding: 12px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  section.panel { background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; padding: 22px; }
  .lead { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  textarea, input, select { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 170px; resize: vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
  .btn { border: 0; border-radius: 10px; padding: 12px 20px; font: 600 1rem var(--body); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 16px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .working { color: var(--muted); display: none; align-items: center; gap: 10px; }
  .working.on { display: inline-flex; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sun); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.5); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .result { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; display: none; }
  .result.on { display: block; }
  .result .doc { background: var(--paper); border-radius: 12px; padding: 18px 20px; overflow-wrap: anywhere; }
  .doc h1 { font: 700 1.5rem var(--display); margin: 0 0 6px; }
  .doc h2 { font: 700 1.05rem var(--display); margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--accent); }
  .doc ul { margin: 4px 0 8px 20px; padding: 0; }
  .doc p { margin: 4px 0; }
  .doc blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--sun); color: var(--muted); }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  .warn ul { margin: 4px 0 0 18px; padding: 0; }
  details { margin-top: 12px; color: var(--muted); }
  details pre { font: .85rem/1.4 var(--mono); white-space: pre-wrap; background: var(--paper); padding: 10px; border-radius: 8px; }
  .tier { margin: 6px 0 0; font-size: .9rem; color: var(--muted); }
  .tier b { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; margin-right: 6px; }
  .tier b.good { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .tier b.medium, .tier b.experimental { background: var(--warn-bg); color: var(--warn-ink); }
  .guided { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 6px; }
  .guided[hidden] { display: none; }
  .linkish { background: none; border: 0; padding: 0; margin-top: 8px; color: var(--accent); font: 600 .95rem var(--body); cursor: pointer; text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
  .chips label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
  .chips input { width: auto; }
  .titles { margin: 0 0 12px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 10px; }
  .card2 { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .card2 h3 { margin: 0 0 6px; font: 700 1rem var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .note { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 14px; padding: 3px; gap: 2px; margin-bottom: 14px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; color: var(--ink); font: 600 .95rem var(--body); padding: 8px 14px; border-radius: 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .talk { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .talk { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--paper); display: flex; flex-direction: column; min-height: 360px; }
  .side.flip { transform: rotate(180deg); }
  .side h3 { margin: 0 0 4px; font: 700 1.05rem var(--display); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pick label { margin: 6px 0 4px; font-size: .85rem; }
  .pick select { background: var(--card); padding: 8px 10px; }
  .log { flex: 1; overflow-y: auto; max-height: 320px; display: flex; flex-direction: column; gap: 8px; padding: 10px 2px; }
  .bubble { max-width: 88%; padding: 9px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bubble.mine { align-self: flex-end; background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .bubble.big { font-size: 1.15rem; }
  .bubble small { display: block; color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .bubble .warn { margin: 6px 0 0; padding: 6px 10px; font-size: .85rem; }
  .say { display: flex; gap: 8px; align-items: stretch; }
  .say input { flex: 1; background: var(--card); }
  .say .btn { padding: 10px 14px; }
  @media (max-width: 520px) { .say { flex-wrap: wrap; } .say input { flex: 1 1 100%; order: -1; } .say .btn { flex: 1; } }
  .mic-big { font-size: 1.05rem; }
  .mic-big.on { background: var(--sun); color: #2a2000; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 0; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
  .opts input { width: auto; }
  .code { font: 700 2.2rem/1 var(--mono); letter-spacing: .15em; color: var(--accent); }
  footer { margin-top: 22px; color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  footer select { width: auto; padding: 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Mosala<span aria-hidden="true"></span></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="ui-lang" role="group" aria-label="Interface language">
      <button data-ui="fr">Français</button><button data-ui="en">English</button>
      <button data-ui="sw">Kiswahili</button><button data-ui="ln">Lingala</button>
    </div>
  </header>

  <div class="status" id="status"></div>

  <nav role="tablist">
    <button role="tab" data-tab="cv" aria-selected="true" data-t="tab_cv"></button>
    <button role="tab" data-tab="offer" aria-selected="false" data-t="tab_offer"></button>
    <button role="tab" data-tab="match" aria-selected="false" data-t="tab_match"></button>
    <button role="tab" data-tab="alert" aria-selected="false" data-t="tab_alert"></button>
    <button role="tab" data-tab="talk" aria-selected="false" data-t="tab_talk"></button>
  </nav>

  <!-- CV from a story -->
  <section class="panel" id="panel-cv">
    <p class="lead" data-t="cv_lead"></p>
    <label for="story"><span data-t="story_label"></span> <span class="hint" data-t="story_hint"></span></label>
    <textarea id="story"></textarea>
    <div class="actions" style="margin-top:8px">
      <button class="btn ghost" id="mic" type="button" data-t="mic"></button>
      <span class="note" data-t="mic_note"></span>
    </div>
    <button class="linkish" id="guided-toggle" type="button" data-t="guided_toggle"></button>
    <div class="guided" id="guided" hidden></div>
    <div class="row">
      <div><label for="name" data-t="name"></label><input id="name" autocomplete="name"></div>
      <div><label for="city" data-t="city"></label><input id="city" autocomplete="address-level2"></div>
      <div><label for="phone" data-t="phone"></label><input id="phone" autocomplete="tel"></div>
      <div><label for="email" data-t="email"></label><input id="email" type="email" autocomplete="email"></div>
    </div>
    <label for="cvlang" data-t="cv_lang"></label>
    <select id="cvlang"></select>
    <div class="actions">
      <button class="btn" id="go-cv" data-t="btn_cv"></button>
      <span class="working" id="w-cv"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-cv"></div>

    <button class="linkish" id="batch-toggle" type="button" data-t="batch_toggle"></button>
    <div id="batch" hidden>
      <p class="note" data-t="batch_lead"></p>
      <div class="actions">
        <input type="file" id="batch-file" accept=".csv,text/csv" style="width:auto">
        <button class="btn ghost" id="batch-template" type="button" data-t="batch_template"></button>
        <button class="btn" id="batch-run" type="button" data-t="batch_run"></button>
      </div>
      <div class="progress" hidden id="batch-bar"><div></div></div>
      <p class="note" id="batch-status"></p>
      <div id="batch-results"></div>
    </div>
  </section>

  <!-- Explain an offer -->
  <section class="panel" id="panel-offer" hidden>
    <p class="lead" data-t="offer_lead"></p>
    <label for="offer" data-t="offer_label"></label>
    <textarea id="offer"></textarea>
    <label for="olang" data-t="your_lang"></label>
    <select id="olang"></select>
    <p class="tier" id="olang-tier"></p>
    <div class="actions">
      <button class="btn" id="go-offer" data-t="btn_offer"></button>
      <span class="working" id="w-offer"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-offer"></div>
  </section>

  <!-- Match CV and offer -->
  <section class="panel" id="panel-match" hidden>
    <p class="lead" data-t="match_lead"></p>
    <div class="row">
      <div><label for="mcv" data-t="your_cv"></label><textarea id="mcv"></textarea></div>
      <div><label for="moffer" data-t="offer_label"></label><textarea id="moffer"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn" id="go-match" data-t="btn_match"></button>
      <span class="working" id="w-match"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-match"></div>
  </section>

  <!-- Community message (NGOs, health centres, local authorities) -->
  <section class="panel" id="panel-alert" hidden>
    <p class="lead" data-t="alert_lead"></p>
    <label for="alert-msg" data-t="alert_label"></label>
    <textarea id="alert-msg"></textarea>
    <label data-t="alert_langs"></label>
    <div class="chips" id="alert-langs"></div>
    <select id="alert-country" style="margin-top:10px;max-width:340px"></select>
    <div class="actions">
      <button class="btn" id="go-alert" data-t="btn_alert"></button>
      <span class="working" id="w-alert"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-alert"></div>
  </section>

  <!-- Conversation: two people, two languages, by voice -->
  <section class="panel" id="panel-talk" hidden>
    <p class="lead" data-t="talk_lead"></p>
    <div class="seg" role="group">
      <button type="button" data-mode="here" aria-pressed="true" data-t="talk_here"></button>
      <button type="button" data-mode="room" aria-pressed="false" data-t="talk_room"></button>
    </div>

    <div id="mode-here">
      <div class="talk">
        <div class="side" id="side-a"></div>
        <div class="side" id="side-b"></div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="opt-speak" checked> <span data-t="auto_speak"></span></label>
        <label><input type="checkbox" id="opt-check"> <span data-t="check_meaning"></span></label>
        <label><input type="checkbox" id="opt-flip"> <span data-t="flip"></span></label>
      </div>
      <p class="note" data-t="talk_note"></p>
    </div>

    <div id="mode-room" hidden>
      <div id="room-join">
        <div class="row">
          <div><label for="room-name" data-t="name"></label><input id="room-name" autocomplete="given-name"></div>
          <div><label for="room-code" data-t="room_code"></label><input id="room-code" inputmode="numeric" maxlength="4" placeholder="1234"></div>
        </div>
        <div class="pick" id="room-pick"></div>
        <div class="actions">
          <button class="btn" id="room-create" type="button" data-t="room_create"></button>
          <button class="btn ghost" id="room-enter" type="button" data-t="room_join"></button>
        </div>
        <p class="note" data-t="room_how"></p>
      </div>
      <div id="room-live" hidden>
        <p style="margin:0"><span data-t="room_code"></span> : <span class="code" id="room-show"></span></p>
        <p class="note" id="room-people"></p>
        <div class="side" style="margin-top:10px">
          <div class="log" id="room-log" aria-live="polite"></div>
          <div class="say">
            <button class="btn mic-big" id="room-mic" type="button" data-t="say"></button>
            <input id="room-text" data-tp="type_here">
            <button class="btn ghost" id="room-send" type="button" data-t="send"></button>
          </div>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="room-speak" checked> <span data-t="auto_speak"></span></label>
          <button class="linkish" id="room-leave" type="button" data-t="room_leave"></button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span data-t="private"></span>
    <label style="margin:0;font-weight:400"><span data-t="model"></span> <select id="model"></select></label>
  </footer>
</div>

<script>

// Small, safe Markdown renderer for the reports Mosala produces.
function md(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  let out = "", inList = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*] (.*)$/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^# /.test(line)) out += `<h1>${inline(line.slice(2))}</h1>`;
    else if (/^## /.test(line)) out += `<h2>${inline(line.slice(3))}</h2>`;
    else if (/^> /.test(line)) out += `<blockquote>${inline(line.slice(2))}</blockquote>`;
    else if (/^---$/.test(line)) out += "<hr>";
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

async function run(kind, payload, render) {

// ---- Voice: dictation (browser service) and read aloud (voices installed on the computer) ----
// Browser dictation language tags. Languages not listed are tried with their own code; if the
// browser does not know them, Mosala asks the person to type instead.
const SPEECH_LANG = { fr: "fr-FR", en: "en-US", sw: "sw-KE", es: "es-ES", pt: "pt-PT", ar: "ar-SA", zh: "zh-CN", hi: "hi-IN", ru: "ru-RU",
  bn: "bn-BD", ur: "ur-PK", am: "am-ET", zu: "zu-ZA", af: "af-ZA", xh: "xh-ZA", so: "so-SO", rw: "rw-RW", yo: "yo-NG", ig: "ig-NG",
  ha: "ha-NG", ln: "ln-CD", arz: "ar-EG", ary: "ar-MA", aeb: "ar-TN", arq: "ar-DZ", ayl: "ar-LY", apd: "ar-SD", mg: "mg-MG",
  st: "st-ZA", tn: "tn-ZA", ts: "ts-ZA", ss: "ss-ZA", ve: "ve-ZA", nso: "nso-ZA", nr: "nr-ZA", ny: "ny-MW", sn: "sn-ZW", lg: "lg-UG", wo: "wo-SN" };
let listening = false, recog = null;
$("mic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const lang = SPEECH_LANG[ui];
  if (!SR || !lang) return showStatus(t("mic_unsupported"));
  if (listening) { recog && recog.stop(); return; }
  recog = new SR(); recog.lang = lang; recog.continuous = true; recog.interimResults = false;
  recog.onresult = (e) => {
    const said = [...e.results].slice(e.resultIndex).map((r) => r[0].transcript).join(" ");
    const box = guidedOn ? document.activeElement : $("story");
    if (box && "value" in box) box.value = (box.value ? box.value + " " : "") + said.trim();
  };
  recog.onend = () => { listening = false; $("mic").textContent = t("mic"); };
  recog.onerror = () => showStatus(t("mic_unsupported"));
  listening = true; $("mic").textContent = t("mic_stop"); showStatus(""); recog.start();
};

// Read aloud with a voice installed on the device. Returns false when there is no voice for the language.
function speak(text, code, quiet) {
  const tag = (SPEECH_LANG[code] || code).toLowerCase(), base = tag.split("-")[0];
  const voices = "speechSynthesis" in window ? speechSynthesis.getVoices() : [];
  const norm = (v) => v.lang.toLowerCase().replace("_", "-");
  const voice = voices.find((v) => norm(v) === tag) || voices.find((v) => norm(v).split("-")[0] === base);
  if (!voice) { if (!quiet) showStatus(t("no_voice")); return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[#*>]/g, "")); u.voice = voice; u.lang = voice.lang;
  speechSynthesis.speak(u);
  return true;
}

// Push to talk: one sentence, then onText(said). Pressing again stops.
let activeDictation = null;
function dictate(code, btn, onText) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return showStatus(t("dictation_off"));
  if (activeDictation) { const same = activeDictation.btn === btn; activeDictation.rec.stop(); if (same) return; }
  const rec = new SR(); rec.lang = SPEECH_LANG[code] || code; rec.continuous = false; rec.interimResults = false;
  rec.onresult = (e) => { const said = [...e.results].map((r) => r[0].transcript).join(" ").trim(); if (said) onText(said); };
  rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") showStatus(t("dictation_off")); };
  rec.onend = () => { btn.classList.remove("on"); btn.textContent = t("say"); if (activeDictation && activeDictation.rec === rec) activeDictation = null; };
  showStatus(""); btn.classList.add("on"); btn.textContent = t("say_stop");
  activeDictation = { rec, btn };
  try { rec.start(); } catch (e) { rec.onend(); showStatus(t("dictation_off")); }
}
function listenButton(text, code) {
  const b = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: t("listen") });
  b.onclick = () => speak(text, code); return b;
}

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.some((x) => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some((x) => x.trim())) rows.push(row);
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.trim().toLowerCase());
  return rows.slice(1).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

// ---- Conversation ----
let COUNTRIES = [];
const LANGS = () => Object.fromEntries(GROUPS.flatMap((g) => g.langs.map((l) => [l.code, { ...l, group: g.id }])));
const esc = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// A country select and a language select that work together. state = { country, lang }.
function fillPicker(cSel, lSel, state) {
  if (!GROUPS.length) return;
  const name = (c) => (ui === "en" ? c.en : c.fr);
  const sorted = [...COUNTRIES].sort((a, b) => (a.code === "CD" ? -1 : b.code === "CD" ? 1 : name(a).localeCompare(name(b))));
  cSel.innerHTML = `<option value="">${t("all_countries")}</option>` +
    sorted.map((c) => `<option value="${c.code}"${c.code === state.country ? " selected" : ""}>${esc(name(c))}</option>`).join("");
  const L = LANGS(), label = (l) => `${esc(l.native)}${l.tier !== "good" ? " · " + t("tier_" + l.tier) : ""}`;
  const country = COUNTRIES.find((c) => c.code === state.country);
  if (country) {
    const codes = country.langs.filter((c) => L[c]);
    if (!codes.includes(state.lang)) state.lang = codes[0];
    lSel.innerHTML = codes.map((c) => `<option value="${c}"${c === state.lang ? " selected" : ""}>${label(L[c])}</option>`).join("");
  } else {
    lSel.innerHTML = GROUPS.map((g) => `<optgroup label="${t("g_" + g.id)}">` +
      g.langs.map((l) => `<option value="${l.code}"${l.code === state.lang ? " selected" : ""}>${label(l)}</option>`).join("") + "</optgroup>").join("");
  }
  lSel.value = state.lang;
}
function picker(box, state) {
  box.innerHTML = `<div><label data-t="country"></label><select></select></div><div><label data-t="language"></label><select></select></div>`;
  const [cSel, lSel] = box.querySelectorAll("select");
  box.querySelectorAll("label").forEach((l, i) => { const id = "p" + Math.random().toString(36).slice(2); l.htmlFor = id; [cSel, lSel][i].id = id; });
  cSel.onchange = () => { state.country = cSel.value; fillPicker(cSel, lSel, state); };
  lSel.onchange = () => { state.lang = lSel.value; };
  return () => fillPicker(cSel, lSel, state);
}

const sides = {
  a: { country: "CD", lang: "fr", title: "person_a" },
  b: { country: "CD", lang: "ln", title: "person_b" },
};
const roomState = { country: "CD", lang: "fr" };
const refills = [];
function buildTalk() {
  for (const key of ["a", "b"]) {
    const s = sides[key], box = $("side-" + key);
    box.innerHTML = `<h3 data-t="${s.title}"></h3><div class="pick"></div><div class="log" aria-live="polite"></div>
      <div class="say"><button class="btn mic-big" type="button" data-t="say"></button><input data-tp="type_here"><button class="btn ghost" type="button" data-t="send"></button></div>`;
    refills.push(picker(box.querySelector(".pick"), s));
    s.log = box.querySelector(".log"); s.input = box.querySelector("input");
    const [mic, send] = box.querySelectorAll(".say button");
    send.onclick = () => talk(key);
    s.input.onkeydown = (e) => { if (e.key === "Enter") talk(key); };
    mic.onclick = () => dictate(s.lang, mic, (said) => { s.input.value = said; talk(key); });
  }
  refills.push(picker($("room-pick"), roomState));
}
function renderPickers() { refills.forEach((f) => f()); }

function bubble(log, html, cls) {
  const b = document.createElement("div"); b.className = "bubble " + (cls || ""); b.dir = "auto"; b.innerHTML = html;
  log.append(b); log.scrollTop = log.scrollHeight; return b;
}
function tierNote(tier) { return tier && tier !== "good" ? `<small>${t("tier_label")} : ${t("tier_" + tier)}</small>` : ""; }
function numbersNote(list) { return list && list.length ? `<div class="warn">${t("talk_numbers").replace("{numbers}", list.join(", "))}</div>` : ""; }

async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, model: $("model").value }) });
  return res.json();
}
function errorText(d) {
  return d.error === "ollama_down" ? t("ollama_down") : d.error === "no_room" ? t("no_room") : d.error === "room_full" ? t("room_full")
    : d.error.startsWith("empty") ? t("empty") : t("failed");
}

async function talk(key) {
  const me = sides[key], other = sides[key === "a" ? "b" : "a"];
  const text = me.input.value.trim(); if (!text) return;
  me.input.value = "";
  const mine = bubble(me.log, esc(text), "mine");
  const theirs = bubble(other.log, `<span class="working on"><span class="dot"></span>${t("translating")}</span>`, "big");
  try {
    const d = await api("/api/talk", { text, from: me.lang, to: other.lang, check: $("opt-check").checked });
    if (d.error) { theirs.textContent = errorText(d); return; }
    theirs.innerHTML = esc(d.text) + numbersNote(d.missing_numbers) + tierNote(d.tier);
    if (d.back) mine.insertAdjacentHTML("beforeend", `<small>${t("understood_as")} ${esc(d.back)}</small>`);
    if ($("opt-speak").checked && !speak(d.text, other.lang, true)) theirs.insertAdjacentHTML("beforeend", `<small>${t("no_voice_show")}</small>`);
  } catch (e) { theirs.textContent = t("failed"); }
}

// Rooms: the server keeps the messages in memory; each phone asks for new ones every 1.5 seconds.
const room = { code: "", pid: "", since: 0, timer: null, busy: false };
async function joinRoom(code) {
  showStatus("");
  try {
    const d = await api("/api/room/join", { room: code, name: $("room-name").value, lang: roomState.lang });
    if (d.error) return showStatus(errorText(d));
    Object.assign(room, { code: d.room, pid: d.pid, since: 0 });
    $("room-show").textContent = d.room; $("room-log").innerHTML = "";
    $("room-join").hidden = true; $("room-live").hidden = false;
    clearInterval(room.timer); room.timer = setInterval(pollRoom, 1500); pollRoom();
  } catch (e) { showStatus(t("failed")); }
}
async function pollRoom() {
  if (room.busy || !room.pid) return;
  room.busy = true;
  try {
    const d = await api("/api/room/poll", { room: room.code, pid: room.pid, since: room.since });
    if (d.error) { if (d.error === "no_room") leaveRoom(); return showStatus(errorText(d)); }
    $("room-people").textContent = t("room_people").replace("{people}", d.people.map((p) => `${p.name} (${p.native})`).join(", "));
    for (const m of d.messages) {
      room.since = m.id;
      if (m.mine) { bubble($("room-log"), esc(m.text), "mine"); continue; }
      const extra = m.text !== m.original ? `<small>${esc(m.name)} · ${esc(m.from)} : ${esc(m.original)}</small>` : `<small>${esc(m.name)}</small>`;
      const b = bubble($("room-log"), esc(m.text) + numbersNote(m.missing_numbers) + extra + tierNote(m.tier), "big");
      if ($("room-speak").checked && !speak(m.text, d.lang, true)) b.insertAdjacentHTML("beforeend", `<small>${t("no_voice_show")}</small>`);
    }
  } catch (e) { /* network hiccup: try again on the next tick */ }
  finally { room.busy = false; }
}
async function sendRoom() {
  const text = $("room-text").value.trim(); if (!text || !room.pid) return;
  $("room-text").value = "";
  const d = await api("/api/room/send", { room: room.code, pid: room.pid, text });
  if (d.error) return showStatus(errorText(d));
  pollRoom();
}
function leaveRoom() { clearInterval(room.timer); room.pid = ""; $("room-live").hidden = true; $("room-join").hidden = false; }
$("room-create").onclick = () => joinRoom("");
$("room-enter").onclick = () => { const c = $("room-code").value.trim(); if (!/^\d{4}$/.test(c)) return showStatus(t("no_room")); joinRoom(c); };
$("room-send").onclick = sendRoom;
$("room-text").onkeydown = (e) => { if (e.key === "Enter") sendRoom(); };
$("room-mic").onclick = () => dictate(roomState.lang, $("room-mic"), (said) => { $("room-text").value = said; sendRoom(); });
$("room-leave").onclick = leaveRoom;
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

(async function init() {
  buildTalk();
  applyUI();
  try {
    const s = await (await fetch("/api/status")).json();
    COUNTRIES = s.countries || [];
    fillSelect($("cvlang"), s.cv_languages, ui === "en" ? "en" : "fr");
    GROUPS = s.groups; renderOfferSelect(); renderAlertLangs(); renderPickers();
    applyUI();
    const models = s.models.length ? s.models : [s.default];
    $("model").innerHTML = models.map((m) => `<option${m === s.default ? " selected" : ""}>${m}</option>`).join("");
    if (!s.ollama) showStatus(t("ollama_down"));
  } catch (e) { showStatus(t("failed")); }
})();
</script>
</body>
</html>
