<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosala</title>
<style>
  /* Layout: one centred working column, tabs on top, result under the form. Works offline (no web fonts). */
  :root {
    --ink: #172a3a; --muted: #5b6b78; --line: #d9e0e6; --paper: #f6f4ef; --card: #ffffff;
    --accent: #0b6e4f; --accent-ink: #ffffff; --sun: #f2c14e; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
    --err-bg: #fde8e6; --err-ink: #8a1f11;
    --display: "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8edf1; --muted: #a3b1bc; --line: #2f3d48; --paper: #121a21; --card: #1a242d;
      --accent: #3fb68b; --accent-ink: #0c1a14; --sun: #f2c14e; --warn-bg: #3a3218; --warn-ink: #f5dc96;
      --err-bg: #3b1d1a; --err-ink: #f6b8ae; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .brand h1 { font: 700 2.1rem/1 var(--display); margin: 0; letter-spacing: -0.01em; }
  .brand h1 span { display: inline-block; width: .5em; height: .5em; background: var(--sun); border-radius: 50%; margin-left: 4px; }
  .brand p { margin: 6px 0 0; color: var(--muted); }
  .ui-lang { display: flex; gap: 6px; flex-wrap: wrap; }
  .ui-lang button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .ui-lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .status { font-size: .9rem; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .status.err { display: block; background: var(--err-bg); color: var(--err-ink); }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 0; overflow-x: auto; }
  nav button { flex: 0 0 auto; border: 0; background: none; font: 600 1rem var(--body); color: var(--muted); padding: 12px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  section.panel { background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; padding: 22px; }
  .lead { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  textarea, input, select { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 170px; resize: vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
  .btn { border: 0; border-radius: 10px; padding: 12px 20px; font: 600 1rem var(--body); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 16px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .working { color: var(--muted); display: none; align-items: center; gap: 10px; }
  .working.on { display: inline-flex; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sun); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.5); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .result { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; display: none; }
  .result.on { display: block; }
  .result .doc { background: var(--paper); border-radius: 12px; padding: 18px 20px; overflow-wrap: anywhere; }
  .doc h1 { font: 700 1.5rem var(--display); margin: 0 0 6px; }
  .doc h2 { font: 700 1.05rem var(--display); margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--accent); }
  .doc ul { margin: 4px 0 8px 20px; padding: 0; }
  .doc p { margin: 4px 0; }
  .doc blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--sun); color: var(--muted); }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  .warn ul { margin: 4px 0 0 18px; padding: 0; }
  details { margin-top: 12px; color: var(--muted); }
  details pre { font: .85rem/1.4 var(--mono); white-space: pre-wrap; background: var(--paper); padding: 10px; border-radius: 8px; }
  .tier { margin: 6px 0 0; font-size: .9rem; color: var(--muted); }
  .tier b { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; margin-right: 6px; }
  .tier b.good { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .tier b.medium, .tier b.experimental { background: var(--warn-bg); color: var(--warn-ink); }
  .guided { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 6px; }
  .guided[hidden] { display: none; }
  .linkish { background: none; border: 0; padding: 0; margin-top: 8px; color: var(--accent); font: 600 .95rem var(--body); cursor: pointer; text-decoration: underline; }
  footer { margin-top: 22px; color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  footer select { width: auto; padding: 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Mosala<span aria-hidden="true"></span></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="ui-lang" role="group" aria-label="Interface language">
      <button data-ui="fr">Français</button><button data-ui="en">English</button>
      <button data-ui="sw">Kiswahili</button><button data-ui="ln">Lingala</button>
    </div>
  </header>

  <div class="status" id="status"></div>

  <nav role="tablist">
    <button role="tab" data-tab="cv" aria-selected="true" data-t="tab_cv"></button>
    <button role="tab" data-tab="offer" aria-selected="false" data-t="tab_offer"></button>
    <button role="tab" data-tab="match" aria-selected="false" data-t="tab_match"></button>
  </nav>

  <!-- CV from a story -->
  <section class="panel" id="panel-cv">
    <p class="lead" data-t="cv_lead"></p>
    <label for="story"><span data-t="story_label"></span> <span class="hint" data-t="story_hint"></span></label>
    <textarea id="story"></textarea>
    <button class="linkish" id="guided-toggle" type="button" data-t="guided_toggle"></button>
    <div class="guided" id="guided" hidden></div>
    <div class="row">
      <div><label for="name" data-t="name"></label><input id="name" autocomplete="name"></div>
      <div><label for="city" data-t="city"></label><input id="city" autocomplete="address-level2"></div>
      <div><label for="phone" data-t="phone"></label><input id="phone" autocomplete="tel"></div>
      <div><label for="email" data-t="email"></label><input id="email" type="email" autocomplete="email"></div>
    </div>
    <label for="cvlang" data-t="cv_lang"></label>
    <select id="cvlang"></select>
    <div class="actions">
      <button class="btn" id="go-cv" data-t="btn_cv"></button>
      <span class="working" id="w-cv"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-cv"></div>
  </section>

  <!-- Explain an offer -->
  <section class="panel" id="panel-offer" hidden>
    <p class="lead" data-t="offer_lead"></p>
    <label for="offer" data-t="offer_label"></label>
    <textarea id="offer"></textarea>
    <label for="olang" data-t="your_lang"></label>
    <select id="olang"></select>
    <p class="tier" id="olang-tier"></p>
    <div class="actions">
      <button class="btn" id="go-offer" data-t="btn_offer"></button>
      <span class="working" id="w-offer"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-offer"></div>
  </section>

  <!-- Match CV and offer -->
  <section class="panel" id="panel-match" hidden>
    <p class="lead" data-t="match_lead"></p>
    <div class="row">
      <div><label for="mcv" data-t="your_cv"></label><textarea id="mcv"></textarea></div>
      <div><label for="moffer" data-t="offer_label"></label><textarea id="moffer"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn" id="go-match" data-t="btn_match"></button>
      <span class="working" id="w-match"><span class="dot"></span><span data-t="working"></span></span>
    </div>
    <div class="result" id="r-match"></div>
  </section>

  <footer>
    <span data-t="private"></span>
    <label style="margin:0;font-weight:400"><span data-t="model"></span> <select id="model"></select></label>
  </footer>
</div>

let GROUPS = [];
const NATIVE = { sw: "Kiswahili",  ln: "Lingala", sw: "Kiswahili", kg: "Kikongo", lua: "Tshiluba", fr: "Français", en: "English", es: "Español",
  pt: "Português", ar: "العربية", zh: "中文", hi: "हिन्दी", bn: "বাংলা", ru: "Русский", ur: "اردو" };

let ui = "fr";
try { ui = localStorage.getItem("mosala-ui") || (navigator.language || "fr").slice(0, 2); } catch (e) {}
if (!T[ui]) ui = "fr";
const t = (k) => (T[ui][k] ?? T.fr[k]);
const $ = (id) => document.getElementById(id);

function applyUI() {
  document.documentElement.lang = ui;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-ui]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.ui === ui));
  renderGuided();
  renderOfferSelect();
  $("story").placeholder = "Nkombo na ngai ezali Jean. Nazali électricien na Kinshasa, nasali mosala oyo mibu motoba…";
}
document.querySelectorAll("[data-ui]").forEach((b) => b.addEventListener("click", () => {
  ui = b.dataset.ui; try { localStorage.setItem("mosala-ui", ui); } catch (e) {} applyUI();
}));

document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
  ["cv", "offer", "match"].forEach((n) => { $("panel-" + n).hidden = n !== b.dataset.tab; });
}));

let guidedOn = false;
function renderGuided() {
  const box = $("guided"), old = [...box.querySelectorAll("input")].map((i) => i.value);
  box.innerHTML = t("q").map((q, i) => `<div><label for="q${i}">${q}</label><input id="q${i}"></div>`).join("");
  box.querySelectorAll("input").forEach((inp, i) => { inp.value = old[i] || ""; });
  box.hidden = !guidedOn; $("story").hidden = guidedOn;
  $("guided-toggle").textContent = guidedOn ? t("guided_hide") : t("guided_toggle");
}
$("guided-toggle").onclick = () => { guidedOn = !guidedOn; renderGuided(); };
function storyText() {
  if (!guidedOn) return $("story").value;
  return t("q").map((q, i) => [q, $("q" + i).value.trim()]).filter(([, a]) => a).map(([q, a]) => `${q} ${a}`).join("\n");
}

function renderOfferSelect() {
  const sel = $("olang"); if (!GROUPS.length) return;
  const keep = sel.value || (["sw", "ln"].includes(ui) ? ui : "ln");
  sel.innerHTML = GROUPS.map((g) => `<optgroup label="${t("g_" + g.id)}">` +
    g.langs.map((l) => `<option value="${l.code}"${l.code === keep ? " selected" : ""}>${l.native}${l.where ? " · " + l.where : ""}</option>`).join("") + "</optgroup>").join("");
  showTier();
}
function showTier() {
  const l = GROUPS.flatMap((g) => g.langs).find((x) => x.code === $("olang").value); if (!l) return;
  $("olang-tier").innerHTML = `${t("tier_label")} : <b class="${l.tier}">${t("tier_" + l.tier)}</b>${l.tier !== "good" ? t("tier_check") : ""}`;
}
$("olang").addEventListener("change", showTier);

function whatsappText(markdown) {
  const lines = markdown.split("\n").map((l) => l.replace(/^#+ /, "").replace(/\*\*/g, "*").trim()).filter(Boolean);
  return lines.slice(0, 18).join("\n");
}

function fillSelect(sel, codes, chosen) {
  sel.innerHTML = codes.map((c) => `<option value="${c}"${c === chosen ? " selected" : ""}>${NATIVE[c] || c}</option>`).join("");
}

function showStatus(msg) { const s = $("status"); s.textContent = msg; s.className = msg ? "status err" : "status"; }

// Small, safe Markdown renderer for the reports Mosala produces.
function md(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  let out = "", inList = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*] (.*)$/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^# /.test(line)) out += `<h1>${inline(line.slice(2))}</h1>`;
    else if (/^## /.test(line)) out += `<h2>${inline(line.slice(3))}</h2>`;
    else if (/^> /.test(line)) out += `<blockquote>${inline(line.slice(2))}</blockquote>`;
    else if (/^---$/.test(line)) out += "<hr>";
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

function saveFile(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function toolbar(box, { markdown, html, base }) {
  const bar = document.createElement("div"); bar.className = "actions";
  const copy = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: t("copy") });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(markdown); copy.textContent = t("copied"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(box.querySelector(".doc")); getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
  const dl = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: t("download") + " (.md)" });
  dl.onclick = () => saveFile(base + ".md", markdown, "text/markdown");
  bar.append(copy, dl);
  if (html) {
    const pr = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: t("print") });
    pr.onclick = () => { const w = window.open(URL.createObjectURL(new Blob([html], { type: "text/html" }))); if (w) setTimeout(() => w.print(), 600); };
    bar.append(pr);
  }
  box.append(bar);
}

async function run(kind, payload, render) {
  const btn = $("go-" + kind), working = $("w-" + kind), box = $("r-" + kind);
  showStatus(""); btn.disabled = true; working.classList.add("on"); box.classList.remove("on");
  try {
    const res = await fetch("/api/" + kind, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...payload, model: $("model").value }) });
    const data = await res.json();
    if (data.error === "ollama_down") return showStatus(t("ollama_down"));
    if (data.error && data.error.startsWith("empty")) return showStatus(t("empty"));
    if (data.error) return showStatus(t("failed"));
    box.innerHTML = ""; render(box, data); box.classList.add("on");
    box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  } catch (e) { showStatus(t("failed")); }
  finally { btn.disabled = false; working.classList.remove("on"); }
}

function warnBox(list) {
  if (!list || !list.length) return "";
  const fmt = (w) => t("w_" + w.kind).replace("{numbers}", w.numbers || "").replace("{text}", w.text || "");
  return `<div class="warn"><strong>${t("check")}</strong><ul>${list.map((w) => `<li>${md(fmt(w)).replace(/<\/?p>/g, "")}</li>`).join("")}</ul></div>`;
}

$("go-cv").onclick = () => run("cv", {
  story: storyText(), to: $("cvlang").value, name: $("name").value, city: $("city").value, phone: $("phone").value, email: $("email").value,
}, (box, d) => {
  box.innerHTML = warnBox(d.warnings) + `<div class="doc">${md(d.markdown)}</div>` +
    `<details><summary>${t("facts")}</summary><pre>${JSON.stringify(d.facts, null, 2).replace(/</g, "&lt;")}</pre></details>`;
  toolbar(box, { markdown: d.markdown, html: d.html, base: "cv_" + $("cvlang").value });
  const wa = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: t("whatsapp") });
  wa.onclick = async () => { try { await navigator.clipboard.writeText(whatsappText(d.markdown)); wa.textContent = t("copied"); } catch (e) {} };
  box.querySelector(".actions").append(wa);
});

$("go-offer").onclick = () => run("offer", { offer: $("offer").value, lang: $("olang").value }, (box, d) => {
  const lang = GROUPS.flatMap((g) => g.langs).find((x) => x.code === $("olang").value);
  let text = `## ${lang ? lang.native : ""}\n\n${d.text}\n`;
  if (d.keywords.length) text += `\n**${t("keywords")}:** ${d.keywords.join(", ")}\n`;
  if (d.local) text += `\n> ${t("local_note")}\n`;
  box.innerHTML = `<div class="doc" dir="auto">${md(text)}</div>`;
  toolbar(box, { markdown: text, base: "offer_" + $("olang").value });
});

$("go-match").onclick = () => run("match", { cv: $("mcv").value, offer: $("moffer").value }, (box, d) => {
  box.innerHTML = `<div class="doc">${md(d.markdown)}</div>`;
  toolbar(box, { markdown: d.markdown, base: "report" });
});

(async function init() {
  applyUI();
  try {
    const s = await (await fetch("/api/status")).json();
    fillSelect($("cvlang"), s.cv_languages, ui === "en" ? "en" : "fr");
    GROUPS = s.groups; renderOfferSelect();
    const models = s.models.length ? s.models : [s.default];
    $("model").innerHTML = models.map((m) => `<option${m === s.default ? " selected" : ""}>${m}</option>`).join("");
    if (!s.ollama) showStatus(t("ollama_down"));
  } catch (e) { showStatus(t("failed")); }
})();
</script>
